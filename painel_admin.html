<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Css/admin.css">
  <title>PulseVida - Painel do Administrador</title>
</head>
<body>

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <h2 style="color: #d9534f; margin: 0;">PulseVida ❤ [Painel Administrativo]</h2>
    </div>
    <button onclick="fazerLogout()" style="background: #d9534f; color: white; padding: 8px 15px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold;">Início</button>
  </header>

  <div class="admin-container" style="padding: 30px; max-width: 1200px; margin: 0 auto;">
    <h2>Visão Geral da Clínica</h2>
    
    <!-- Métricas -->
    <div class="cards-metricas" style="display: flex; gap: 20px; margin-bottom: 30px;">
      <div class="card-metrica" style="background: white; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 4px solid #007bff;">
        <h3>Total de Agendamentos</h3>
        <p id="totalAgendamentos" style="font-size: 24px; font-weight: bold; color: #333;">0</p>
      </div>
      <div class="card-metrica" style="background: white; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 4px solid #28a745;">
        <h3>Status do Sistema</h3>
        <p id="statusSistema" style="font-size: 24px; font-weight: bold; color: #28a745;">Online</p>
      </div>
    </div>

    <!-- Tabela de Agendamentos Cadastrados -->
    <div class="tabela-container" style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
      <h3 style="margin-top: 0; color: #333;">Lista de Agendamentos Online</h3>
      <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
        <thead>
          <tr style="background: #007bff; color: white; text-align: left;">
            <th style="padding: 10px;">ID</th>
            <th style="padding: 10px;">Paciente</th>
            <th style="padding: 10px;">Médico / Unidade</th>
            <th style="padding: 10px;">Data / Hora</th>
            <th style="padding: 10px;">Status</th>
            <th style="padding: 10px; text-align: center;">Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo">
          <!-- Preenchido via JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Verifica se o admin está logado
    if (localStorage.getItem("logado") !== "true" || localStorage.getItem("usuarioAtivo") !== "admin") {
      alert("Acesso negado! Faça login como Administrador.");
      window.location.href = "login.html";
    }

    async function carregarDadosAdmin() {
      try {
        const respostaAgendamentos = await fetch('http://localhost:3000/api/agendamentos');
        const agendamentos = await respostaAgendamentos.json();

        document.getElementById("totalAgendamentos").textContent = agendamentos.length;

        const tbody = document.getElementById("tabelaCorpo");
        tbody.innerHTML = "";

        if (agendamentos.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#777; padding: 20px;">Nenhum agendamento encontrado no servidor.</td></tr>`;
          return;
        }

        agendamentos.forEach(item => {
          const tr = document.createElement("tr");
          tr.style.borderBottom = "1px solid #eee";
          tr.innerHTML = `
            <td style="padding: 10px;">${item.id || '-'}</td>
            <td style="padding: 10px;">${item.paciente || 'Paciente PulseVida'}</td>
            <td style="padding: 10px;">${item.hospital || item.medico || 'Clínica Geral'}</td>
            <td style="padding: 10px;">${item.data || 'Hoje'}</td>
            <td style="padding: 10px;"><span style="color: green; font-weight: bold;">${item.status || 'Confirmado'}</span></td>
            <td style="padding: 10px; text-align: center;">
              <button onclick="excluirAgendamento(${item.id})" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">Excluir</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error("Erro ao conectar com o backend:", error);
        document.getElementById("statusSistema").textContent = "Offline (Erro API)";
        document.getElementById("statusSistema").style.color = "red";
      }
    }

    async function excluirAgendamento(id) {
      if (!confirm("Tem certeza que deseja excluir esta consulta?")) return;

      try {
        const resposta = await fetch(`http://localhost:3000/api/agendamentos/${id}`, {
          method: 'DELETE'
        });

        if (resposta.ok) {
          alert("Consulta excluída com sucesso!");
          carregarDadosAdmin(); // Atualiza a tabela na hora
        } else {
          alert("Erro ao excluir a consulta.");
        }
      } catch (err) {
        console.error("Erro de conexão ao excluir:", err);
        alert("Erro ao comunicar com o servidor.");
      }
    }

    function fazerLogout() {
      localStorage.clear();
      window.location.href = "frontend/index.html";
    }

    carregarDadosAdmin();
  </script>

</body>
</html>
