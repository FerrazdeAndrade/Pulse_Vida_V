<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseVida - Agendamento</title>
  <style>
    body {
      font-family: rgb(124, 213, 124);
      margin: 0;
      padding: 0;
      zoom: 0.85;
      background-image: url('imagens/Fundo1.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      position: relative;
      min-height: 100vh;
    }

    /* Camada translúcida para melhorar a leitura sobre o fundo */
    .overlay-fundo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #008080;
      z-index: -1;
    }

    header {
      background-color: whitesmoke;
      padding: 15px 40px;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
      color: blue;
      position: relative;
      z-index: 10;
    }

    nav {
      background-color: rgb(221, 221, 221);
      padding: 10px 20px;
      border-radius: 35px;
      word-spacing: 10px;
    }

    nav > a {
      color: blue;
      text-decoration: none;
      font-size: 18px;
      padding: 10px 15px;
      border-radius: 20px;
      transition: 0.3s;
    }

    nav a:hover {
      background-color: #99cdf8;
      color: rgb(0, 17, 255);
    }

    .pulse {
      text-decoration: none;
      color: blue;
      font-weight: bold;
    }

    .pulse:hover {
      color: rgb(63, 176, 228);
    }

    /* Container Principal */
    main {
      padding: 20px 30px 80px 30px;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    h2.titulo-principal {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }

    /* Layout Lado a Lado (Flexbox) */
    .painel-grid {
      display: flex;
      gap: 25px;
      align-items: flex-start;
    }

    /* Colunas Form e Lista */
    .card-formulario, .card-lista {
      flex: 1;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
    }

    .card-formulario h3, .card-lista-cabecalho h3 {
      margin-top: 0;
      font-size: 18px;
      color: #333;
    }

    .unidade-texto {
      margin-bottom: 15px;
      font-size: 13px;
      color: #555;
      background: #f1f3f5;
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 4px solid #007bff;
    }

    /* Inputs do Formulário */
    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #007bff;
    }

    .input-readonly {
      background-color: #f1f3f5;
      color: #495057;
    }

    .linha-dupla {
      display: flex;
      gap: 10px;
    }

    /* Botões do Formulário */
    .botoes-form {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button.btn-limpar {
      flex: 1;
      padding: 12px;
      background-color: #e2e8f0;
      color: #4a5568;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button.btn-limpar:hover {
      background-color: #cbd5e0;
    }

    button.btn-agendar {
      flex: 2;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button.btn-agendar:hover {
      background-color: #0056b3;
    }

    /* Seção Acordeão (Abrir/Fechar) dos Agendamentos Salvos */
    .card-lista-cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding-bottom: 10px;
      border-bottom: 2px solid #f1f3f5;
      user-select: none;
    }

    .badge-contador {
      background: #e1effe;
      color: #007bff;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .seta-toggle {
      font-size: 14px;
      color: #666;
      font-weight: bold;
    }

    .card-lista-conteudo {
      margin-top: 15px;
      max-height: 430px;
      overflow-y: auto;
    }

    /* Estilo dos itens salvos */
    .item-salvo {
      background: #f9f9f9;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      border-left: 4px solid #28a745;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #333;
    }

    .item-detalhes p {
      margin: 2px 0;
    }

    button.btn-excluir {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      transition: background 0.2s;
    }

    button.btn-excluir:hover {
      background-color: #bd2130;
    }

    /* Botão Flutuante (Início) */
    .btn-flutuante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #007bff;
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: transform 0.2s;
    }

    .btn-flutuante:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

<div class="overlay-fundo"></div>

<header>
  <a class="pulse" href="index.html"><h1>PulseVida ❤️</h1></a>
  <nav>
    <a href="aba_a.html">Solicitar</a>
    <a href="aba_b.html">Solicitações</a>
    <a href="aba_c.html">Agendamento</a>
    <a href="aba_d.html">Recomendações</a>
  </nav>
</header>

<main>
  <h2 class="titulo-principal">Painel de Agendamentos</h2>

  <!-- Container Lado a Lado -->
  <div class="painel-grid">
    
    <!-- COLUNA DA ESQUERDA: Formulário -->
    <div class="card-formulario">
      <h3>Nova Consulta</h3>
      
      <p id="unidadeSelecionadaTexto" class="unidade-texto">
        Unidade: Carregando...
      </p>

      <label>NOME PACIENTE:</label>
      <input type="text" id="nomePaciente" placeholder="Nome completo">

      <label>CPF:</label>
      <input type="text" id="cpfPaciente" placeholder="000.000.000-00">

      <label>Nº SUS:</label>
      <input type="text" id="susPaciente" placeholder="Cartão do SUS">

      <label>ESPECIALIDADE:</label>
      <input type="text" id="especialidade" value="Hipertensão" readonly class="input-readonly">

      <label>NOME MÉDICO:</label>
      <input type="text" id="nomeMedico" placeholder="Médico responsável">

      <div class="linha-dupla">
        <div style="flex: 1;">
          <label>DATA:</label>
          <input type="date" id="dataConsulta">
        </div>
        <div style="flex: 1;">
          <label>HORÁRIO:</label>
          <input type="time" id="horarioConsulta">
        </div>
      </div>

      <div class="botoes-form">
        <button type="button" onclick="limparFormulario()" class="btn-limpar">🔄 Limpar</button>
        <button type="button" onclick="realizarAgendamento()" class="btn-agendar">Agendar Consulta</button>
      </div>
    </div>

    <!-- COLUNA DA DIREITA: Agendamentos Salvos com Acordeão -->
    <div class="card-lista">
      <div onclick="toggleAgendamentos()" class="card-lista-cabecalho">
        <div style="display: flex; align-items: center; gap: 10px;">
          <h3>Agendamentos Salvos</h3>
          <span id="contadorBadge" class="badge-contador">0</span>
        </div>
        <span id="iconeSeta" class="seta-toggle">▲</span>
      </div>

      <div id="containerAgendamentos" class="card-lista-conteudo">
        <div id="listaAgendamentos"></div>
      </div>
    </div>

  </div>
</main>

<!-- Logo de Saquarema 2x maior no canto inferior direito -->
<div style="position: fixed; bottom: 15px; right: 80px; z-index: 1000; background: rgba(255, 255, 255, 0.9); padding: 10px 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
  <img src="imagens/logo_saquarema.avif" alt="Logo Saquarema" style="height: 80px; object-fit: contain; display: block;">
</div>

<!-- Botão Flutuante (Início) -->
<a href="index.html" class="btn-flutuante" title="Voltar ao Início">
  ➜
</a>

<script>
// Carrega os agendamentos do Servidor Node.js ao abrir a página
window.onload = function() {
  carregarAgendamentosDoServidor();
};

function toggleAgendamentos() {
  const container = document.getElementById("containerAgendamentos");
  const seta = document.getElementById("iconeSeta");

  if (container.style.display === "none") {
    container.style.display = "block";
    seta.innerText = "▲";
  } else {
    container.style.display = "none";
    seta.innerText = "▼";
  }
}

function limparFormulario() {
  document.getElementById("nomePaciente").value = "";
  document.getElementById("cpfPaciente").value = "";
  document.getElementById("susPaciente").value = "";
  document.getElementById("nomeMedico").value = "";
  document.getElementById("dataConsulta").value = "";
  document.getElementById("horarioConsulta").value = "";
}

// Salvar agendamento direto no Servidor Node.js
async function realizarAgendamento() {
  const nome = document.getElementById("nomePaciente").value;
  const cpf = document.getElementById("cpfPaciente").value;
  const sus = document.getElementById("susPaciente").value;
  const especialidade = document.getElementById("especialidade").value;
  const medico = document.getElementById("nomeMedico").value;
  const data = document.getElementById("dataConsulta").value;
  const horario = document.getElementById("horarioConsulta").value;

  if (!nome || !cpf || !sus || !medico || !data || !horario) {
    alert("Por favor, preencha todos os campos do formulário.");
    return;
  }

  const novoAgendamento = {
    paciente: nome,
    cpf: cpf,
    sus: sus,
    especialidade: especialidade,
    nomeMedico: medico,
    data: data,
    horario: horario,
    hospital: "Unidade Principal (Saquarema)"
  };

  try {
    const resposta = await fetch('http://localhost:3000/api/agendamentos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(novoAgendamento)
    });

    if (resposta.ok) {
      alert("Consulta agendada e salva no servidor com sucesso!");
      limparFormulario();
      carregarAgendamentosDoServidor();
    } else {
      alert("Erro ao salvar agendamento no servidor.");
    }
  } catch (err) {
    console.error("Erro de conexão:", err);
    alert("Não foi possível conectar ao servidor Node.js.");
  }
}

// Buscar lista de agendamentos diretamente do Servidor Node.js
async function carregarAgendamentosDoServidor() {
  try {
    const resposta = await fetch('http://localhost:3000/api/agendamentos');
    const solicitacoes = await resposta.json();
    
    const container = document.getElementById("listaAgendamentos");
    container.innerHTML = "";

    let totalValidos = solicitacoes.length;

    if (totalValidos === 0) {
      container.innerHTML = "<p style='color: #666; text-align: center; margin: 20px 0; font-size: 13px;'>Nenhum agendamento salvo.</p>";
    } else {
      solicitacoes.forEach((item) => {
        let dataFormatada = item.data || "";
        if (dataFormatada.includes("-")) {
          let partes = dataFormatada.split("-");
          if(partes.length === 3) dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        let nomeP = item.paciente || item.nomePaciente || "Paciente";
        let medP = item.nomeMedico || item.hospital || "Geral";
        let horaP = item.horario || item.horarioConsulta || "--:--";
        let susP = item.sus || "N/A";

        container.innerHTML += `
          <div class="item-salvo">
            <div class="item-detalhes">
              <p><strong>${nomeP}</strong></p>
              <p>SUS: ${susP} | Médico/Local: ${medP}</p>
              <p>📅 ${dataFormatada} às ${horaP}</p>
            </div>
            <button onclick="excluirAgendamento('${item.id}')" class="btn-excluir">Excluir</button>
          </div>
        `;
      });
    }

    document.getElementById("contadorBadge").innerText = totalValidos;
  } catch (err) {
    console.error("Erro ao buscar agendamentos:", err);
  }
}

// Excluir agendamento diretamente do Servidor Node.js pela rota DELETE
async function excluirAgendamento(id) {
  if (confirm("Tem certeza que deseja excluir este agendamento?")) {
    try {
      const resposta = await fetch(`http://localhost:3000/api/agendamentos/${id}`, {
        method: 'DELETE'
      });

      if (resposta.ok) {
        carregarAgendamentosDoServidor();
      } else {
        alert("Não foi possível excluir o agendamento no servidor.");
      }
    } catch (err) {
      console.error("Erro de conexão ao excluir:", err);
      alert("Erro ao conectar com o servidor para exclusão.");
    }
  }
}
</script>

</body>
</html>
