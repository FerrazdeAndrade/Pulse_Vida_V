
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Css/login.css">
  <title>PulseVida - Recuperar Senha</title>
</head>
<body>

  <!-- Lado esquerdo com a imagem da médica -->
  <div class="imagem-lateral"></div>

  <!-- Lado direito com o formulário -->
  <div class="login-wrapper">
    <div class="login-container">
      <div class="logo-container">
        <h2>PulseVida ❤</h2>
      </div>

      <h2>Recuperar Senha</h2>

      <form id="formRecuperar">
        <input type="text" id="usuarioRecuperar" placeholder="Digite seu Usuário ou E-mail" autocomplete="off" required>
        <input type="password" id="novaSenha" placeholder="Digite a Nova Senha" autocomplete="new-password" required>
        <button type="submit">Atualizar Senha</button>
      </form>

      <p class="cadastro-link">
        Lembrou da senha? <a href="login.html">Entrar</a>
      </p>
    </div>
  </div>

  <script>
    const API_URL = "https://pulse-vida-v-api.onrender.com";

    document.getElementById("formRecuperar").addEventListener("submit", async function(e) {
      e.preventDefault();

      const usuarioInput = document.getElementById("usuarioRecuperar").value.trim();
      const novaSenhaInput = document.getElementById("novaSenha").value.trim();

      try {
        // Envia a requisição para a rota de alteração de senha na API do Render
        const resposta = await fetch(`${API_URL}/api/recuperar-senha`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            usuario: usuarioInput,
            novaSenha: novaSenhaInput
          })
        });

        const resultado = await resposta.json();

        if (resposta.ok && resultado.sucesso) {
          alert(resultado.mensagem || "Palavra-passe redefinida com sucesso!");
          window.location.href = "login.html";
        } else {
          alert(resultado.mensagem || "Utilizador não encontrado no sistema.");
        }
      } catch (erro) {
        console.error("Erro ao conectar com a API:", erro);
        alert("Erro de conexão com o servidor no Render. Verifique se ele está ativo.");
      }
    });
  </script>

</body>
</html>
