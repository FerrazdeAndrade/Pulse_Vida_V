<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/aba_b.css">
<title>Solicitações</title>
<style>
  body {
    background-image: url('/imagens/Fundo1.jpg');
    background-size: cover;
    background-position: center;
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    align-items: center;
  }

  /* Barra Inferior Direita com Início e Logo de Saquarema */
  .sidebar-inferior {
    position: fixed;
    bottom: 20px;
    right: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 1000;
  }

  .sidebar-inferior img {
    width: 200px;
    height: auto;
    border-radius: 8px;
  }

  .btn-inicio {
    background-color: #007bff;
    color: white;
    padding: 10px 25px;
    text-decoration: none;
    border-radius: 15px;
    font-weight: bold;
    font-size: 18px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  .btn-inicio:hover {
    background-color: #0056b3;
  }

  /* Conteúdo Principal Centralizado */
  .conteudo-principal {
    width: 100%;
    max-width: 1100px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin-bottom: 25px;
    width: 100%;
  }

  /* Título Principal com Logo integrada de forma limpa */
  h1.pulse-titulo {
    font-size: 52px;
    color: #d90429;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 0;
  }

  .logo-topo {
    height: 75px;
    vertical-align: middle;
  }

  nav {
    margin-top: 20px;
  }

  nav a {
    margin: 0 15px;
    text-decoration: none;
    color: #222;
    font-weight: bold;
    font-size: 22px;
  }

  nav a:hover {
    color: #d90429;
  }

  .titulo-secao {
    font-size: 36px;
    color: #111;
    text-align: center;
    margin: 25px 0;
    font-weight: bold;
    text-transform: uppercase;
  }

  /* Grid de Cards (5 por página) com bordas vermelhas */
  .grid-tabelas {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    max-width: 1000px;
    width: 100%;
  }

  .tabela-card {
    background: rgba(255, 255, 255, 0.95);
    border: 3px solid #d90429;
    border-radius: 10px;
    padding: 15px;
    width: 280px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    box-sizing: border-box;
  }

  .tabela-card p {
    margin: 8px 0;
    font-size: 16px;
    color: #333;
  }

  .btn-excluir {
    background-color: #d90429;
    color: white;
    border: none;
    padding: 8px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    width: 100%;
    margin-top: 10px;
  }

  .btn-excluir:hover {
    background-color: #b7031f;
  }

  .paginacao {
    margin-top: 30px;
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .paginacao button {
    padding: 10px 20px;
    cursor: pointer;
    background-color: #fff;
    border: 2px solid #ccc;
    border-radius: 6px;
    font-weight: bold;
    font-size: 18px;
  }

  .paginacao button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>

<body>

  <script>
    if (localStorage.getItem("logado") !== "true") {
      window.location.href = "login.html";
    }
  </script>

  <!-- Botão Início e Logo de Saquarema no canto inferior direito -->
  <div class="sidebar-inferior">
    <a href="index.html" class="btn-inicio">Início</a>
    <img src="/imagens/logo_saquarema.avif" alt="Logo Saquarema">
  </div>

  <div class="conteudo-principal">
    <header>
      <div>
        <h1 class="pulse-titulo">
          <img src="/imagens/logo_pulsevida.png" alt="Logo PulseVida" class="logo-topo"> 
          PulseVida ❤️
        </h1>
      </div>
      <nav>
        <a href="aba_a.html">Solicitar</a>
        <a href="aba_b.html">Solicitações</a>
        <a href="aba_c.html">Agendamento</a>
        <a href="aba_d.html">Recomendações</a>
      </nav>
    </header>

    <h1 class="titulo-secao">SOLICITAÇÕES & AGENDAMENTOS SALVOS</h1>

    <div class="grid-tabelas" id="listaSolicitacoes">
      <!-- Os cartões preenchidos de 5 em 5 aparecerão aqui dinamicamente -->
    </div>

    <div class="paginacao" id="controlesPaginacao" style="display:none;">
      <button id="btnAnterior" onclick="mudarPagina(-1)">Anterior</button>
      <span id="infoPagina" style="font-weight: bold; font-size: 18px;"></span>
      <button id="btnProximo" onclick="mudarPagina(1)">Próximo</button>
    </div>
  </div>

<script>
let todosAgendamentos = [];
let paginaAtual = 1;
const itensPorPagina = 5;

document.addEventListener("DOMContentLoaded", () => {
  carregarDoServidor();
});

async function carregarDoServidor() {
  try {
    const resposta = await fetch('http://localhost:3000/api/agendamentos');
    todosAgendamentos = await resposta.json();
    paginaAtual = 1;
    renderizarPagina();
  } catch (err) {
    console.error("Erro ao buscar dados do servidor:", err);
    document.getElementById("listaSolicitacoes").innerHTML = "<p style='color: red; font-weight: bold; font-size: 18px;'>Erro ao conectar com o servidor Node.js.</p>";
  }
}

function renderizarPagina() {
  const container = document.getElementById("listaSolicitacoes");
  const divPaginacao = document.getElementById("controlesPaginacao");
  container.innerHTML = "";

  if (todosAgendamentos.length === 0) {
    container.innerHTML = "<p style='font-size: 20px; font-weight: bold; color: #333;'>Nenhuma solicitação ou agendamento encontrado.</p>";
    divPaginacao.style.display = "none";
    return;
  }

  divPaginacao.style.display = "flex";

  let totalPaginas = Math.ceil(todosAgendamentos.length / itensPorPagina);
  if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
  if (paginaAtual < 1) paginaAtual = 1;

  let inicio = (paginaAtual - 1) * itensPorPagina;
  let fim = inicio + itensPorPagina;
  let itensPagina = todosAgendamentos.slice(inicio, fim);

  itensPagina.forEach((s) => {
    let nome = s.paciente || s.nome || s.nomePaciente || "-";
    let cpf = s.cpf ? `CPF: ${s.cpf}` : "";
    let sus = s.sus ? `SUS: ${s.sus}` : "";
    let especialidade = s.especialidade || s.problema || "-";
    let medico = s.nomeMedico || s.hospital || "-";
    
    let dataFormatada = s.data || "";
    if (dataFormatada.includes("-")) {
      let partes = dataFormatada.split("-");
      if(partes.length === 3) dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    let horario = s.horario || s.horarioConsulta || "--:--";

    let cardDiv = document.createElement("div");
    cardDiv.className = "tabela-card";
    cardDiv.innerHTML = `
      <p><strong>Paciente:</strong> ${nome}</p>
      <p><strong>${sus}</strong></p>
      <p><strong>${cpf}</strong></p>
      <p><strong>Especialidade:</strong> ${especialidade}</p>
      <p><strong>Médico/Local:</strong> ${medico}</p>
      <p><strong>Data/Hora:</strong> ${dataFormatada} às ${horario}</p>
      <button class="btn-excluir" onclick="excluirDoServidor('${s.id}')">❌ Excluir</button>
    `;
    container.appendChild(cardDiv);
  });

  document.getElementById("infoPagina").innerText = `Página ${paginaAtual} de ${totalPaginas}`;
  document.getElementById("btnAnterior").disabled = (paginaAtual === 1);
  document.getElementById("btnProximo").disabled = (paginaAtual === totalPaginas);
}

function mudarPagina(direcao) {
  paginaAtual += direcao;
  renderizarPagina();
}

async function excluirDoServidor(id) {
  if (confirm("Deseja excluir este agendamento do servidor?")) {
    try {
      const resposta = await fetch(`http://localhost:3000/api/agendamentos/${id}`, {
        method: 'DELETE'
      });

      if (resposta.ok) {
        carregarDoServidor();
      } else {
        alert("Erro ao excluir no servidor.");
      }
    } catch (err) {
      console.error("Erro de conexão:", err);
    }
  }
}
</script>

</body>
</html>
